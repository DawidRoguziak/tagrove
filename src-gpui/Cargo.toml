[workspace]
members = ["crates/media_tagger_client", "crates/media_tagger_gpui"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# The core stays a member of the Tauri workspace: its `*.workspace = true` keys resolve
# from src-tauri/Cargo.toml. `bun run gpui:lock-parity` keeps its dependency versions
# identical in both lock files (ADR 0036).
media_tagger_core = { path = "../src-tauri/crates/media_tagger_core" }
media_tagger_client = { path = "crates/media_tagger_client" }
serde_json = "1.0"
tempfile = "3.13"
# GPUI comes only from the Zed repository, every crate at the same rev: the commit of
# the stable release tag v1.29.3 (ADR 0036, decision D1 of docs/plans/gpui-port).
gpui = { git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false, features = ["font-kit", "wayland", "x11"] }

[workspace]
members = [".", "crates/media_tagger_core"]
default-members = [".", "crates/media_tagger_core"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "gif", "webp"] }
libc = "0.2"
# Bundled SQLite >= 3.54 (RUSTSEC-2026-0459, ADR 0032). `fallible_uint` keeps the checked
# usize/u64 <-> INTEGER conversions that rusqlite made opt-in in 0.38.
rusqlite = { version = "0.41", features = ["backup", "bundled", "fallible_uint", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"

[package]
name = "media_tagger"
description = "Tagrove browses and tags large image and media collections."
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[[bin]]
name = "media_tagger"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
libc.workspace = true
media_tagger_core = { path = "crates/media_tagger_core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
gtk = "0.18"
libloading = "0.9"
libmpv2 = { version = "6", features = ["render"] }
libmpv2-sys = "4.0.1"
webkit2gtk = "=2.0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
image.workspace = true
media_tagger_core = { path = "crates/media_tagger_core", features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true

[package]
name = "media_tagger"
description = "Tagrove browses and tags large image and media collections."
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[[bin]]
name = "media_tagger"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
csv = "1.3"
fs2 = "0.4"
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "gif", "webp"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["backup", "bundled", "hooks"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
walkdir = "2.5"
zip = "2.2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
gtk = "0.18"
libloading = "0.9"
libmpv2 = { version = "6", features = ["render"] }
libmpv2-sys = "4.0.1"
webkit2gtk = "=2.0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.13"
